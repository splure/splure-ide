name: Build Spluride

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux,  arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux,  arch: arm64 }
          - { os: macos-15,         platform: darwin, arch: arm64 }
          - { os: windows-2025,     platform: win32,  arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream VS Code and apply Spluride
        run: scripts/prepare.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev libgbm1 libgtk-3-0 libsecret-1-dev

      - name: Put signtool on PATH
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -like '*\x64\*' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw "signtool.exe not found in the Windows SDK" }
          $st.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Using $($st.FullName)"
          
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/build.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: spluride-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
